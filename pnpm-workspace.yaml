packages:
  - 'apps/*'
  - 'packages/*'
# pnpm 11：未列出的依赖默认不跑 install/postinstall 脚本；跑脚本前需批准（pnpm approve-builds）
allowBuilds:
  '@modelcontextprotocol/ext-apps': false
  better-sqlite3: false
  core-js: true
  esbuild: true
  tesseract.js: true
  tldjs: false
# @nestjs-modules/mailer 的可选 peer：@types/mjml 4.18.x / 5.4.x 依赖尚未发布的 @types/mjml-core（上游发布错误），固定到可解析版本
overrides:
  '@types/mjml': 5.0.0
  # langchain@1.5.10 的源提交锁定这组传递版本；更新版本要求 @langchain/core >=1.3，
  # 与当前后端统一的 1.2.x 不兼容。
  '@langchain/langgraph': 1.4.14
  '@langchain/langgraph-checkpoint': 1.1.5
  '@langchain/langgraph-sdk': 1.10.2
