driver_registry:
  product-e2e: { driver: product-pty-v1, entrypoint: packaged-assistant-cli }
  operational-acceptance:
    {
      driver: product-pty-plus-fault-v1,
      entrypoint: packaged-cli-or-declared-startup-command,
    }
  live-smoke: { driver: product-pty-live-v1, entrypoint: packaged-assistant-cli }
  release-governance: { driver: release-gate-v1, entrypoint: frozen-release-manifest }
cleanup_registry:
  product-e2e: hermetic-reset-v1
  operational-acceptance: hermetic-reset-and-dependency-health-v1
  live-smoke: live-test-tenant-cleanup-v1
  release-governance: release-worktree-and-fixture-cleanup-v1
oracle_registry:
  cli: 'Packaged CLI/real PTY screen, exit, and interaction transcript with secret redaction.'
  audit: 'Read-only security-audit query by safe correlation identifiers.'
  capability-ledger: 'Frozen ledger status and evidence-link validator.'
  clock: 'Controlled clock observation and expiry assertion.'
  events: 'Read-only committed event projection by sequence and event ID.'
  filesystem: 'Post-action workspace hash/path inventory confined to the temporary root.'
  health: 'Declared liveness/dependency health response.'
  local-config: 'Sanitized CLI preference inventory; secrets are forbidden.'
  logs: 'Structured allowlisted log query plus protected-sentinel scan.'
  mapping-manifest: 'Frozen baseline-tool and target-scope mapping validator.'
  mcp: 'Contract-faithful MCP request/catalog/result recorder.'
  mem0: 'Contract-faithful Mem0 scope/provenance operation recorder.'
  migration-receipts: 'Signed forward/restore/rollback evidence set.'
  network: 'DNS/redirect/socket-connect recorder proving blocked endpoints received no request or credential.'
  object-store: 'Read-only object metadata, reference, and hash inventory.'
  pg: 'Read-only PostgreSQL query against public test evidence views.'
  process: 'Scoped local process-tree, stream, stdin, and exit observation.'
  provider: 'Scripted provider request/response recorder with credential fields redacted.'
  readiness: 'Production-admission readiness decision and named failed control.'
  receipts: 'Canonical case-receipt index for the frozen manifest.'
  redis: 'Namespace-limited key/projection inventory; never a durable truth oracle.'
  secret-scan: 'Sentinel scan across permitted captures; never prints the protected value.'
  startup: 'Process exit and sanitized startup diagnostic.'
  telemetry: 'Read-only bounded trace/metric query with cardinality checks.'
