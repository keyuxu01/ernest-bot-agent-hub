assertion_rule: 'Each atomic case must prove the exact THEN clause through its type-resolved driver plus closed read-only oracles; every product-e2e case must include packaged CLI/PTY observation, and suite success requires every required case.'
execution_contract:
  case_identity: 'Each entries[].id is the stable atomic case ID; suite is only its execution grouping.'
  action_source: 'The exact WHEN clause of the referenced spec Scenario.'
  assertion_source: 'The exact THEN clause of the referenced spec Scenario; suite prose may add but never replace it.'
  fixture_resolution: 'Compose every fixture listed for entries[].suite in suite_contracts before the case; composition is ordered left-to-right and later overlays may only add deterministic fault capability.'
  driver_resolution: 'Resolve entries[].type through driver_registry; product-e2e always starts through the packaged CLI in a real PTY.'
  cleanup_resolution: 'Resolve entries[].type through cleanup_registry; cleanup failure invalidates the case.'
  receipt_resolution: 'receipts/{baseline}/{case_id}.json; one canonical receipt per case ID and frozen source/test manifest.'
suite_contracts:
  E2E-001-AUTH: { fixtures: [F0, F1, F6] }
